                        patterns: [
                            {
                                id: "body_dyspraxia",
                                title: "Dyspraxie & Motorik",
                                icon: "PenTool",
                                behavior: "Schrift ist unleserlich, wirkt tollpatschig, stößt Dinge um, hat Probleme beim Sport/Umziehen.",
                                neuro_logic: "Motorische Planungsstörung. Die Automatisierung von Bewegungen ist erschwert. Das Schreiben von Hand blockiert Arbeitsgedächtnis-Kapazität.",
                                solutions: {
                                    fondamental: [
                                        { name: "Laptop/Tablet", tag: "Kompensation", text: "Ab C2/C3 einführen. Tippen ist motorisch einfacher als Schreiben." },
                                        { name: "Größere Linien", tag: "Materialanpassung", text: "Hefte mit vergrößerter Lineatur oder Kästchen nutzen." },
                                        { name: "Keine Noten auf Schönschrift", tag: "Nachteilsausgleich", text: "Bewerten Sie den Inhalt, nicht die Form. Schriftbild nicht in die Note einfließen lassen." },
                                        { name: "Klebeband am Tisch", tag: "Ordnungshilfe", text: "Markieren Sie den Platz für das Heft mit Tape, damit es nicht verrutscht." },
                                        { name: "Hilfe beim Umziehen", tag: "Assistenz", text: "Mehr Zeit geben oder Schuhe mit Klettverschluss empfehlen (Eltern)." }
                                    ],
                                    secondaire: [
                                        { name: "Digital First", tag: "Standardisierung", text: "Erlaubnis, alle längeren Texte digital zu verfassen (auch in Prüfungen)." },
                                        { name: "Skripte statt Mitschreiben", tag: "Kognitive Entlastung", text: "Lehrer-Skript kopieren. Gleichzeitiges Zuhören und Schreiben ist bei Dyspraxie fast unmöglich." },
                                        { name: "Mündliche Prüfung", tag: "Alternative Leistungsform", text: "Wenn die Hand weh tut: Teile der Prüfung mündlich ablegen." },
                                        { name: "Sport-Beurteilung", tag: "Individuelle Bezugsnorm", text: "Bewertung nach individuellem Fortschritt oder Einsatz, nicht nach Norm-Tabellen." },
                                        { name: "Ergonomie", tag: "Gesundheitsförderung", text: "Auf gute Sitzhaltung achten, da die Muskelspannung oft niedrig ist (Hypotonie)." }
                                    ]
                                }
                            },
                            {
                                id: "body_intero",
                                title: "Interozeption (Innenschau)",
                                icon: "Thermometer",
                                behavior: "Geht nicht zur Toilette bis es dringend ist, vergisst zu essen/trinken, zieht Jacke im Winter nicht an (spürt Kälte nicht).",
                                neuro_logic: "Interozeptive Wahrnehmungsstörung (Alexithymie auf körperlicher Ebene). Signale (Hunger, Durst) erreichen das Bewusstsein nicht rechtzeitig.",
                                solutions: {
                                    fondamental: [
                                        { name: "Feste Toiletten-Zeiten", tag: "Routinebildung", text: "Schicken Sie das Kind in der großen Pause, auch wenn es 'nicht muss'." },
                                        { name: "Trink-Erinnerung", tag: "Visualisierung", text: "Gemeinsames Trinken in der Klasse einführen. Flasche auf den Tisch." },
                                        { name: "Kleidungs-Check", tag: "Fürsorge", text: "Vor der Pause: 'Alle ziehen die Jacke an'. Kontrollieren, ob der Reißverschluss zu ist." },
                                        { name: "Gefühle visualisieren", tag: "Body-Scan", text: "Bild eines Körpers: 'Wo spürst du die Wut? Im Bauch? In den Händen?'" },
                                        { name: "Snack-Pausen", tag: "Blutzucker-Management", text: "Erinnern Sie ans Essen, um Unterzuckerung (Hangry) zu vermeiden." }
                                    ],
                                    secondaire: [
                                        { name: "App-Erinnerungen", tag: "Selbstmanagement", text: "Smartwatch-Alarm für Trinken oder Toilette." },
                                        { name: "Freier Zugang zu Wasser", tag: "Grundbedürfnis", text: "Darf jederzeit trinken, auch im Unterricht." },
                                        { name: "Temperatur-Check", tag: "Kognitive Kompensation", text: "App nutzen: 'Es sind 5 Grad -> Ich brauche eine Jacke', statt auf das (fehlende) Kältegefühl zu warten." },
                                        { name: "Achtsamkeits-Training", tag: "Wahrnehmungsschulung", text: "Kurze Body-Scans in den Alltag einbauen, um die Wahrnehmung zu schulen." },
                                        { name: "Pausen-Management", tag: "Gesundheitsschutz", text: "Darauf achten, dass in der Mittagspause tatsächlich gegessen wird (und nicht nur über Spezialinteressen geredet)." }
                                    ]
                                }
                            }
                        ]
                    }
                }

                            {
                                id: "soc_literal",
                                title: "Compréhension littérale & Ironie",

                                neuro_logic: "Les cerveaux autistes traitent souvent le langage de manière sémantiquement précise (Bottom-Up). Le contexte pragmatique (ton, mimique) est moins intuitivement intégré.",
                                solutions: {
                                    fondamental: [
                                        { name: "Parler clairement", tag: "Low Arousal (Elvén)", text: "Évitez les expressions idiomatiques. Dites 'Arrête de parler' au lieu de 'Est-ce qu'il faut faire autant de bruit ?'." },
                                        { name: "Balise Ironie", tag: "TEACCH / Visuel", text: "Si vous faites une blague, précisez : 'C'était une blague'. Utilisez des gestes convenus." },
                                        { name: "Scénarios Sociaux", tag: "Social Stories (Gray)", text: "Utilisez des Social Stories pour expliquer explicitement et logiquement les situations sociales (récré, salutations)." },
                                        { name: "Consignes précises", tag: "Étayage (Scaffolding)", text: "Au lieu de 'Range', dites 'Mets les crayons dans la boîte et le cahier dans le sac'." },
                                        { name: "Pont d'intérêts", tag: "Enseignement par les pairs", text: "Utilisez l'intérêt spécifique de l'enfant pour créer un lien avec les autres (ex: Club Lego)." }

                                    secondaire: [
                                        { name: "Règles Explicites", tag: "Curriculum Caché (Endow)", text: "Expliquez le 'Curriculum Caché'. Pourquoi fait-on ça ? La logique convainc, l'autorité souvent non." },
                                        { name: "Rôle de groupe", tag: "Apprentissage Coopératif", text: "Donnez à l'élève un rôle clair (ex: secrétaire, recherche) au lieu de 'Discutez entre vous'." },
                                        { name: "Feedback Écrit", tag: "Canal Visuel", text: "Donner les critiques par écrit. La critique orale en situation émotionnelle est souvent non traitée." },
                                        { name: "Pause Sociale", tag: "Gestion Énergie", text: "Permission de passer la récréation à la bibliothèque au lieu de devoir socialiser dans la cour bruyante." },
                                        { name: "Système Mentor", tag: "Circle of Friends", text: "Un élève empathique explique les dynamiques sociales sans juger." }
                                    ]
                                }
                            },
                            {

                                title: "Franchise & Honnêteté",
                                icon: "Megaphone",
                                behavior: "Dit ouvertement au prof que le cours est ennuyeux ou corrige les fautes devant la classe. Paraît impoli.",
                                neuro_logic: "Les personnes autistes priorisent souvent la vérité factuelle sur les hiérarchies sociales. C'est rarement une insulte, mais une information (un fait).",
                                solutions: {
                                    fondamental: [
                                        { name: "Filtre de Vérité", tag: "Stratégie Cognitive", text: "Visualiser : Est-ce vrai ? Est-ce gentil ? Est-ce nécessaire ? Apprendre quand utiliser les 'mensonges sociaux'." },
                                        { name: "Correction Privée", tag: "Gestion des contingences", text: "Convenir : 'Si je fais une erreur, dis-le moi après le cours à mon bureau'." },
                                        { name: "Changement Perspective", tag: "Théorie de l'Esprit (ToM)", text: "Expliquez logiquement les sentiments : 'Si tu dis ça, X se sent triste parce que...'." },
                                        { name: "Quota de questions", tag: "Économie de jetons", text: "Limiter les questions/corrections à 3 par heure (avec jetons), le reste est écrit." },
                                        { name: "Ne pas prendre perso", tag: "Posture pro", text: "Comprenez-le comme un feedback factuel, pas une attaque contre votre autorité." }

                                        { name: "Justification Logique", tag: "Rationalité", text: "Si une règle semble illogique, elle ne sera pas suivie. Expliquez le sens (sécurité, temps)." },
                                        { name: "Prévention Harcèlement", tag: "Psychoéducation", text: "Sensibiliser la classe (avec accord) à la neurodiversité pour éviter l'exclusion due à la 'différence'." }
                                    ]
                                }
                            }
                        ]

                            {
                                id: "body_dyspraxia",
                                title: "Dyspraxie & Motricité",
                                icon: "PenTool",
                                behavior: "Écriture illisible, semble maladroit, renverse des choses, problèmes en sport/habillement.",
                                neuro_logic: "Planification motrice altérée. L'automatisation est faible. Écrire à la main bloque la mémoire de travail.",
                                solutions: {
                                    fondamental: [
                                        { name: "Laptop/Tablette", tag: "Compensation", text: "Introduire dès le C2/C3. Taper est motricement plus simple qu'écrire." },
                                        { name: "Lignes agrandies", tag: "Adaptation matériel", text: "Cahiers avec interlignes agrandis ou carreaux." },
                                        { name: "Pas de note de soin", tag: "Aménagement raisonnable", text: "Évaluez le contenu, pas la forme. L'écriture ne doit pas impacter la note." },
                                        { name: "Scotch sur table", tag: "Aide organisation", text: "Marquez l'emplacement du cahier avec du scotch pour qu'il ne glisse pas." },
                                        { name: "Aide habillement", tag: "Assistance", text: "Donner plus de temps ou recommander des chaussures à scratch (parents)." }
                                    ],
                                    secondaire: [
                                        { name: "Digital First", tag: "Standardisation", text: "Permission de rédiger tous les textes longs numériquement (même en examen)." },
                                        { name: "Scripts prof", tag: "Allègement cognitif", text: "Copier le script du prof. Écouter et écrire en même temps est quasi impossible avec dyspraxie." },
                                        { name: "Examen Oral", tag: "Forme alternative", text: "Si la main fait mal : passer une partie de l'examen à l'oral." },
                                        { name: "Évaluation Sport", tag: "Norme individuelle", text: "Noter selon le progrès individuel ou l'effort, pas selon les barèmes normés." },
                                        { name: "Ergonomie", tag: "Santé", text: "Veiller à une bonne posture, le tonus musculaire étant souvent bas (hypotonie)." }
                                    ]
                                }
                            },
                            {
                                id: "body_intero",
                                title: "Intéroception (Perception interne)",
                                icon: "Thermometer",
                                behavior: "Ne va pas aux toilettes avant l'urgence, oublie de manger/boire, ne met pas de veste en hiver.",
                                neuro_logic: "Trouble de la perception intéroceptive (Alexithymie corporelle). Les signaux n'atteignent pas la conscience.",
                                solutions: {
                                    fondamental: [
                                        { name: "Horaires Toilettes", tag: "Création de routine", text: "Envoyez l'enfant à la récréation, même s'il 'n'a pas envie'." },
                                        { name: "Rappel Boisson", tag: "Visualisation", text: "Moment boire collectif. Bouteille sur la table." },
                                        { name: "Check Vêtements", tag: "Soin", text: "Avant la récré : 'Tout le monde met sa veste'. Vérifier si le zip est fermé." },
                                        { name: "Visualiser émotions", tag: "Body-Scan", text: "Image du corps : 'Où sens-tu la colère ? Ventre ? Mains ?'" },
                                        { name: "Pauses Snack", tag: "Gestion Glycémie", text: "Rappeler de manger pour éviter l'hypoglycémie (Hangry)." }
                                    ],
                                    secondaire: [
                                        { name: "Rappels App", tag: "Autogestion", text: "Alarme montre connectée pour boire ou toilettes." },
                                        { name: "Accès libre eau", tag: "Besoin fondamental", text: "Droit de boire à tout moment, même en cours." },
                                        { name: "Check Température", tag: "Compensation cognitive", text: "Utiliser une App : 'Il fait 5 degrés -> Il faut une veste', au lieu d'attendre la sensation de froid." },
                                        { name: "Entraînement Conscience", tag: "Prévention", text: "Intégrer de courts Body-Scans pour exercer la perception." },
                                        { name: "Gestion Pauses", tag: "Santé", text: "Veiller à ce que l'élève mange vraiment à midi (et ne parle pas juste de ses intérêts)." }
                                    ]
                                }
                            }
                        ]
                    }
                }
            }
        };

        const DomainCard = ({ id, data, onClick, ui }) => (
            <button 
                onClick={() => onClick(id)} 
                className={`text-left group w-full bg-white rounded-2xl border-2 border-${data.color}-100 p-6 hover:border-${data.color}-500 card-hover relative overflow-hidden h-full flex flex-col shadow-sm`}
            >
                <div className={`absolute -right-6 -top-6 w-24 h-24 bg-${data.color}-50 rounded-full group-hover:scale-150 transition-transform duration-500`}></div>
                
                <div className="relative z-10 flex items-start justify-between mb-4">
                    <div className={`p-3 bg-${data.color}-100 text-${data.color}-700 rounded-xl shadow-inner`}>
                        <Icon name={data.icon} size={32} />
                    </div>
                </div>
                
                <div className="relative z-10">
                    <h3 className="text-xl font-bold text-slate-900 mb-1">{data.title}</h3>
                    <p className={`text-xs font-bold text-${data.color}-600 uppercase tracking-wider mb-3`}>{data.subtitle}</p>
                    <p className="text-sm text-slate-500 leading-relaxed mb-4">{data.desc}</p>
                </div>

                <div className={`mt-auto pt-4 border-t border-slate-100 flex items-center text-${data.color}-600 font-bold text-sm group-hover:gap-2 transition-all`}>
                    {ui.strategiesBtn} <Icon name="ArrowRight" size={16} className="ml-1" />
                </div>
            </button>
        );

        const SymptomItem = ({ item, color, onClick }) => (
            <div 
                onClick={onClick} 
                className={`bg-white p-5 rounded-xl border border-slate-200 cursor-pointer hover:border-${color}-500 hover:shadow-lg transition-all group relative overflow-hidden`}
            >
                <div className={`absolute left-0 top-0 bottom-0 w-1.5 bg-${color}-400 group-hover:bg-${color}-600 transition-colors`}></div>
                <div className="flex items-start gap-4 pl-2">
                    <div className={`p-2 bg-slate-50 rounded-lg text-slate-400 group-hover:text-${color}-600 transition-colors`}>
                        <Icon name={item.icon} size={24} />
                    </div>
                    <div>
                        <h4 className="font-bold text-slate-800 text-lg mb-1">{item.title}</h4>
                        <p className="text-slate-500 text-sm leading-relaxed">{item.behavior}</p>
                    </div>
                    <div className="ml-auto self-center opacity-0 group-hover:opacity-100 transition-opacity transform translate-x-2 group-hover:translate-x-0">
                        <Icon name="ChevronRight" className={`text-${color}-500`} />
                    </div>
                </div>
            </div>
        );

        const DetailModal = ({ item, domain, onClose, ui, lang }) => {
            const [activeTab, setActiveTab] = useState('fondamental');

            const handlePrint = () => {
                const element = document.getElementById('printable-area');
                const opt = {
                    margin: 15,
                    filename: `Autism_Expert_${lang}_${item.id}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                window.html2pdf().set(opt).from(element).save();
            };

            const solutions = item.solutions[activeTab] || [];

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm overflow-y-auto">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl animate-fade-in my-8 flex flex-col max-h-[95vh]">
                        
                        {/* Header */}
                        <div className={`bg-gradient-to-r from-${domain.color}-500 to-${domain.color}-600 p-6 rounded-t-2xl text-white flex justify-between items-start shrink-0 shadow-md`}>
                            <div>
                                <div className="flex items-center gap-2 text-white/80 text-xs font-bold uppercase tracking-widest mb-2">
                                    <Icon name={domain.icon} size={14}/> {domain.title}
                                </div>
                                <h2 className="text-2xl md:text-3xl font-black leading-tight flex items-center gap-3">
                                    {item.title}
                                </h2>
                            </div>
                            <button onClick={onClose} className="bg-white/20 hover:bg-white/30 p-2 rounded-full transition-colors text-white">
                                <Icon name="X" size={24} />
                            </button>
                        </div>

                        {/* Controls */}
                        <div className="p-3 bg-slate-50 border-b border-slate-200 flex gap-2 shrink-0 no-print overflow-x-auto">
                            <button 
                                onClick={() => setActiveTab('fondamental')}
                                className={`flex-1 py-3 px-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition-all ${activeTab === 'fondamental' ? `bg-white text-${domain.color}-700 shadow-sm ring-1 ring-${domain.color}-300` : 'text-slate-500 hover:bg-slate-100'}`}
                            >
                                <Icon name="School" size={18} /> {ui.tabPrimary}
                            </button>
                            <button 
                                onClick={() => setActiveTab('secondaire')}
                                className={`flex-1 py-3 px-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition-all ${activeTab === 'secondaire' ? `bg-white text-${domain.color}-700 shadow-sm ring-1 ring-${domain.color}-300` : 'text-slate-500 hover:bg-slate-100'}`}
                            >
                                <Icon name="GraduationCap" size={18} /> {ui.tabSecondary}
                            </button>
                        </div>

                        {/* Content */}
                        <div id="printable-area" className="p-8 overflow-y-auto bg-white flex-grow">
                            {/* Print Header */}
                            <div className="hidden print:block mb-6 border-b pb-4">
                                <h1 className="text-3xl font-bold text-slate-900">{ui.title}</h1>
                                <p className="text-sm text-slate-500">{item.title} | {activeTab === 'fondamental' ? ui.tabPrimary : ui.tabSecondary}</p>
                            </div>

                            {/* Neuro-Logic Box */}
                            <div className={`mb-8 bg-${domain.color}-50 rounded-xl p-6 border-l-4 border-${domain.color}-500 relative print:border-slate-300 print:bg-white`}>
                                <div className="flex items-center gap-2 mb-3">
                                    <div className={`bg-${domain.color}-100 p-1.5 rounded-lg text-${domain.color}-700`}>
                                        <Icon name="BrainCircuit" size={20} />
                                    </div>
                                    <h3 className={`text-${domain.color}-900 font-bold text-lg`}>{ui.neuroLogicTitle}</h3>
                                </div>
                                <p className="text-slate-800 leading-relaxed font-medium">
                                    {item.neuro_logic}
                                </p>
                            </div>

                            {/* Interventionen */}
                            <h3 className="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2 border-b pb-2">
                                <Icon name="Wrench" className={`text-${domain.color}-600`} /> 
                                {ui.interventionsTitle}
                            </h3>

                            <div className="grid gap-6">
                                {solutions.map((sol, idx) => (
                                    <div key={idx} className="flex gap-4 group">
                                        <div className="flex flex-col items-center">
                                            <div className={`w-8 h-8 rounded-full bg-${domain.color}-100 text-${domain.color}-600 flex items-center justify-center font-bold text-sm border-2 border-white shadow-sm shrink-0`}>
                                                {idx + 1}
                                            </div>
                                            {idx !== solutions.length - 1 && <div className="w-0.5 flex-grow bg-slate-100 my-1 group-hover:bg-${domain.color}-100 transition-colors"></div>}
                                        </div>
                                        <div className="pb-2">
                                            <div className="flex items-center gap-2 mb-1 flex-wrap">
                                                <h4 className="font-bold text-slate-900 text-lg">{sol.name}</h4>
                                                <span className="text-[10px] uppercase font-bold px-2 py-0.5 bg-slate-100 text-slate-500 rounded-full border border-slate-200">
                                                    {sol.tag}
                                                </span>
                                            </div>
                                            <p className="text-slate-600 leading-relaxed text-base">
                                                {sol.text}
                                            </p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            
                            <div className="hidden print:block mt-8 pt-4 border-t text-xs text-slate-400">
                                {ui.footer}
                            </div>
                        </div>

                        {/* Footer */}
                        <div className="p-4 border-t bg-slate-50 rounded-b-2xl flex justify-between items-center shrink-0 no-print">
                            <span className="text-xs text-slate-400 font-medium">
                                {ui.sources}
                            </span>
                            <button 
                                onClick={handlePrint}
                                className={`px-6 py-2.5 rounded-lg bg-slate-800 hover:bg-slate-900 text-white font-bold flex items-center gap-2 shadow-lg transition-all`}
                            >
                                <Icon name="Printer" size={18} /> {ui.print}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [view, setView] = useState('home');
            const [lang, setLang] = useState('de'); // 'de' or 'fr'
            const [currentDomainId, setCurrentDomainId] = useState(null);
            const [currentSymptom, setCurrentSymptom] = useState(null);

            const handleDomainSelect = (id) => {
                setCurrentDomainId(id);
                setView('domain');
                window.scrollTo(0,0);
            };

            const handleBack = () => {
                setView('home');
                setCurrentDomainId(null);
            };

            const toggleLang = () => {
                setLang(prev => prev === 'de' ? 'fr' : 'de');
            };

            const currentContent = content[lang];
            const currentData = currentContent.data;
            const currentDomain = currentDomainId ? currentData[currentDomainId] : null;

            return (
                <div className="min-h-screen pb-12 bg-[#f0f9ff] pattern-grid">
                    {/* Header */}
                    <nav className="bg-white/90 backdrop-blur-md border-b border-sky-100 sticky top-0 z-30 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={handleBack}>
                                <div className="bg-gradient-to-r from-sky-500 to-indigo-600 text-white p-2 rounded-lg shadow-md">
                                    <Icon name="Infinity" size={20} />
                                </div>
                                <span className="font-black text-slate-900 text-xl tracking-tight hidden md:inline">PsyNavi: <span className="text-sky-600">{currentContent.ui.uiTitle || "Expert"}</span></span>
                                <span className="font-black text-slate-900 text-xl tracking-tight md:hidden">PsyNavi</span>
                            </div>
                            
                            <div className="flex items-center gap-4">
                                {/* Language Toggle */}
                                <button 
                                    onClick={toggleLang}
                                    className="flex items-center gap-1 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-full font-bold text-sm transition-colors border border-slate-200"
                                >
                                    <span className={lang === 'de' ? "text-slate-900" : "text-slate-400"}>DE</span>
                                    <span className="text-slate-300">|</span>
                                    <span className={lang === 'fr' ? "text-slate-900" : "text-slate-400"}>FR</span>
                                </button>

                                <div className="hidden md:flex gap-3">
                                    <span className="px-3 py-1 bg-sky-50 text-sky-700 rounded-full text-xs font-bold border border-sky-100">{currentContent.ui.edition}</span>
                                    <span className="px-3 py-1 bg-slate-100 text-slate-600 rounded-full text-xs font-bold">{currentContent.ui.levels}</span>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <div className="max-w-7xl mx-auto px-4 pt-10">
                        {/* HOME VIEW */}
                        {view === 'home' && (
                            <div className="animate-fade-in">
                                <header className="text-center mb-16 max-w-3xl mx-auto">
                                    <h1 className="text-4xl md:text-5xl font-black text-slate-900 mb-6 leading-tight">
                                        {currentContent.ui.headerTitle}<span className="text-sky-500">.</span>
                                    </h1>
                                    <p className="text-lg text-slate-600 leading-relaxed">
                                        {currentContent.ui.headerSubtitle}
                                    </p>
                                </header>

                                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
                                    {Object.entries(currentData).map(([key, data]) => (
                                        <DomainCard key={key} id={key} data={data} onClick={handleDomainSelect} ui={currentContent.ui} />
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* DOMAIN VIEW */}
                        {view === 'domain' && currentDomain && (
                            <div className="animate-fade-in">
                                <button 
                                    onClick={handleBack} 
                                    className="mb-8 flex items-center gap-2 text-slate-500 hover:text-sky-600 font-bold transition-colors inline-flex px-4 py-2 hover:bg-white rounded-lg"
                                >
                                    <Icon name="ArrowLeft" size={20} /> {currentContent.ui.back}
                                </button>

                                <div className="grid lg:grid-cols-12 gap-8">
                                    {/* Sidebar */}
                                    <div className="lg:col-span-4">
                                        <div className={`bg-gradient-to-br from-${currentDomain.color}-500 to-${currentDomain.color}-600 text-white rounded-3xl p-8 shadow-2xl sticky top-28`}>
                                            <div className="bg-white/20 w-16 h-16 rounded-2xl flex items-center justify-center backdrop-blur-md mb-6 shadow-inner">
                                                <Icon name={currentDomain.icon} size={32} />
                                            </div>
                                            <h2 className="text-3xl font-black mb-2">{currentDomain.title}</h2>
                                            <p className="text-white/80 font-bold uppercase tracking-wider text-sm mb-6">{currentDomain.subtitle}</p>
                                            <p className="text-white/90 leading-relaxed mb-8">{currentDomain.desc}</p>
                                            
                                            <div className="bg-black/10 rounded-xl p-4 border border-white/10">
                                                <div className="flex items-center gap-2 font-bold mb-2 text-sm">
                                                    <Icon name="Info" size={16}/> {currentContent.ui.noteTitle}
                                                </div>
                                                <p className="text-xs text-white/80 leading-relaxed">
                                                    {currentContent.ui.noteText}
                                                </p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Content */}
                                    <div className="lg:col-span-8 space-y-4">
                                        <h3 className="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                                            <span className={`bg-${currentDomain.color}-100 text-${currentDomain.color}-600 p-2 rounded-lg`}>
                                                <Icon name="List" size={20} />
                                            </span>
                                            {currentContent.ui.symptomsTitle}
                                        </h3>
                                        {currentDomain.patterns.map(item => (
                                            <SymptomItem 
                                                key={item.id} 
                                                item={item} 
                                                color={currentDomain.color} 
                                                onClick={() => setCurrentSymptom(item)}
                                            />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* MODAL */}
                    {currentSymptom && currentDomain && (
                        <DetailModal 
                            item={currentSymptom} 
                            domain={currentDomain} 
                            onClose={() => setCurrentSymptom(null)}
                            ui={currentContent.ui}
                            lang={lang}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
