                                <p className="text-2xl font-bold text-blue-600">100%</p>
                                <p className="text-gray-500 text-sm">Spielerisch</p>
                            </div>
                            <div className="bg-white rounded-2xl p-4 shadow-md text-center">
                                <span className="text-3xl">📥</span>
                                <p className="text-2xl font-bold text-green-600">PDF</p>
                                <p className="text-gray-500 text-sm">Download</p>
                            </div>
                        </div>

                        {/* Worksheets Grid */}
                        <div className="space-y-8">
                            {filteredWorksheets.map(worksheet => (
                                <Worksheet
                                    key={worksheet.id}
                                    worksheet={worksheet}
                                    onDownload={downloadPDF}
                                />
                            ))}
                        </div>

                        {filteredWorksheets.length === 0 && (
                            <div className="text-center py-12">
                                <span className="text-6xl">🔍</span>
                                <p className="text-gray-500 mt-4">Keine Arbeitsblätter gefunden</p>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t mt-12 py-6 no-print">
                        <div className="max-w-6xl mx-auto px-4 text-center">
                            <p className="text-gray-500">
                                🎨 PsyNavi Vorschul-Arbeitsblätter • Erstellt mit Liebe für kleine Entdecker
                            </p>
                            <p className="text-gray-400 text-sm mt-2">
                                Diese Arbeitsblätter sind für den privaten und pädagogischen Gebrauch bestimmt.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
