                                solutions: {
                                    fondamental: [
                                        { name: "Matériel concret", tag: "Enactif", text: "Toujours travailler avec matériel (Cubes, colliers). Les doigts sont OK (mieux que deviner) !" },
                                        { name: "Bande numérique", tag: "Visualisation", text: "Une bande (1-20 ou 1-100) collée sur la table comme aide permanente." },
                                        { name: "Table de Pythagore", tag: "Soulagement", text: "Les tables de multiplication ne doivent pas être par cœur (si ça bloque). Utiliser la table." },
                                        { name: "Tableau de numération", tag: "Structure", text: "Couleurs pour Unités/Dizaines/Centaines (Couleurs Montessori)." },
                                        { name: "Grouper les quantités", tag: "Entraînement", text: "Pas compter 'un, deux, trois', mais 'c'est 5' (Subitizing)." }
                                    ],
                                    secondaire: [
                                        { name: "Calculatrice", tag: "Aménagement", text: "Permission immédiate, même en 'calcul mental'. Focus sur le raisonnement." },
                                        { name: "Formulaire", tag: "Mémoire", text: "Toutes les formules disponibles. La mémoire de travail est souvent faible." },
                                        { name: "Extension temps", tag: "Stress", text: "Plus de temps pour les tests. Le stress bloque le peu de sens du nombre existant." },
                                        { name: "Lire les problèmes", tag: "Transfert", text: "Souvent la lecture bloque. Lire la consigne à haute voix ou visualiser (schéma)." },
                                        { name: "Lien Réalité", tag: "Sens", text: "Maths en faisant les courses/cuisine. Éviter l'abstrait." }
                                    ]
                                }
                            }
                        ]
                    },
                    tech: {
                        title: "Technologie & Outils",
                        subtitle: "Les lunettes du cerveau",
                        color: "sky",
                        icon: "Laptop",
                        desc: "Les outils numériques ne sont pas de la 'triche', mais une compensation nécessaire (comme un fauteuil roulant).",
                        patterns: [
                            {
                                id: "dys_tech",
                                title: "Technologie d'Assistance",
                                icon: "Wifi",
                                behavior: "L'élève s'épanouit avec le numérique. Soudain, les textes sont bons et complexes.",
                                neuro_logic: "La technologie ponte l'interface déficitaire (Lecture/Écriture) et permet à l'intellect intact de s'exprimer. Elle rétablit l'égalité des chances.",
                                solutions: {
                                    fondamental: [
                                        { name: "Intégration iPad", tag: "One2One", text: "Tablettes avec accessibilité (Synthèse vocale, Dictée)." },
                                        { name: "Apps Ludiques", tag: "Gamification", text: "Anton / Apps donnent un feedback immédiat et motivent." },
                                        { name: "Stylo lecteur", tag: "Audio", text: "Sonoriser les fiches. L'enfant pointe le texte -> le stylo lit." },
                                        { name: "Fonction Photo", tag: "Mémoire", text: "Photographier le tableau au lieu de copier." },
                                        { name: "Choix Police", tag: "Design", text: "Régler OpenDyslexic sur la tablette (plus lourd en bas)." }
                                    ],
                                    secondaire: [
                                        { name: "Scanner PDF (OCR)", tag: "Workflow", text: "Scanner les feuilles (Office Lens) et faire lire (Voice Dream)." },
                                        { name: "Traducteurs", tag: "Langues", text: "En langues : Outils de traduction pour chercher le vocabulaire (DeepL)." },
                                        { name: "Logiciel Mindmap", tag: "Structure", text: "Planifier les rédactions numériquement (XMind), puis rédiger." },
                                        { name: "Logiciel Présentation", tag: "Alternative", text: "PowerPoint/Canva au lieu d'affiches (le correcteur aide)." },
                                        { name: "Manuel Numérique", tag: "Standard", text: "Accès à Leloo.lu ou PDF des livres pour zoom et recherche." }
                                    ]
                                }
                            }
                        ]
                    },
                    psyche: {
                        title: "Psyché & Estime de soi",
                        subtitle: "Je ne suis pas bête",
                        color: "indigo",
                        icon: "Smile",
                        desc: "Éviter l'impuissance apprise, l'anxiété scolaire et le sentiment d'échec.",
                        patterns: [
                            {
                                id: "dys_self",
                                title: "Crise d'estime de soi",
                                icon: "Frown",
                                behavior: "Dit 'Je suis bête', se compare, clown de classe (distraction) ou retrait silencieux.",
                                neuro_logic: "L'échec constant malgré l'effort mène à 'l'impuissance apprise'. L'enfant croit ne pas contrôler sa réussite. Risque de psychopathologie secondaire (dépression).",
                                solutions: {
                                    fondamental: [
                                        { name: "Transparence", tag: "Psychoéducation", text: "Expliquez à l'enfant (et la classe) : 'Ton cerveau est une Ferrari, mais le frein à main de l'écriture coince'." },
                                        { name: "Focus Forces", tag: "Ressources", text: "Valorisez les talents : Sport, Art, Social. Le DYS n'est qu'une petite part." },
                                        { name: "Norme Individuelle", tag: "Évaluation", text: "Comparez l'enfant à lui-même ('Mieux que la semaine passée'), pas à la classe." },
                                        { name: "Succès garantis", tag: "Efficacité", text: "Donnez des tâches réussissables pour sentir la compétence." },
                                        { name: "Pas de stylo rouge", tag: "Correction", text: "Corrigez en vert ou bleu. Le rouge est la couleur de l'échec." }
                                    ],
                                    secondaire: [
                                        { name: "Modèles", tag: "Inspiration", text: "Montrer des DYS célèbres (Einstein, Steve Jobs). 'Penser différemment est une force'." },
                                        { name: "Expliquer l'équité", tag: "Justice", text: "Dire : 'Les lunettes ne rendent pas plus intelligent, elles permettent de voir'. Contre la jalousie." },
                                        { name: "Solution-Focus", tag: "Coaching", text: "'Comment as-tu résolu ça ?' (Louer la stratégie, pas le résultat)." },
                                        { name: "Climat ouvert", tag: "Ambiance", text: "Encourager à en parler : 'J'ai une dyslexie, j'ai besoin d'un moment'." },
                                        { name: "Check Mental", tag: "Prévention", text: "Demander régulièrement : 'Comment ça va avec l'école ?'. Capter la frustration." }
                                    ]
                                }
                            }
                        ]
                    }
                }
            }
        };

        const DomainCard = ({ id, data, onClick, ui }) => (
            <button 
                onClick={() => onClick(id)} 
                className={`text-left group w-full bg-white rounded-2xl border-2 border-${data.color}-100 p-6 hover:border-${data.color}-500 card-hover relative overflow-hidden h-full flex flex-col shadow-sm`}
            >
                <div className={`absolute -right-6 -top-6 w-24 h-24 bg-${data.color}-50 rounded-full group-hover:scale-150 transition-transform duration-500`}></div>
                
                <div className="relative z-10 flex items-start justify-between mb-4">
                    <div className={`p-3 bg-${data.color}-100 text-${data.color}-700 rounded-xl shadow-inner`}>
                        <Icon name={data.icon} size={32} />
                    </div>
                </div>
                
                <div className="relative z-10">
                    <h3 className="text-xl font-bold text-slate-900 mb-1">{data.title}</h3>
                    <p className={`text-xs font-bold text-${data.color}-600 uppercase tracking-wider mb-3`}>{data.subtitle}</p>
                    <p className="text-sm text-slate-500 leading-relaxed mb-4">{data.desc}</p>
                </div>

                <div className={`mt-auto pt-4 border-t border-slate-100 flex items-center text-${data.color}-600 font-bold text-sm group-hover:gap-2 transition-all`}>
                    {ui.strategiesBtn} <Icon name="ArrowRight" size={16} className="ml-1" />
                </div>
            </button>
        );

        const SymptomItem = ({ item, color, onClick }) => (
            <div 
                onClick={onClick} 
                className={`bg-white p-5 rounded-xl border border-slate-200 cursor-pointer hover:border-${color}-500 hover:shadow-lg transition-all group relative overflow-hidden`}
            >
                <div className={`absolute left-0 top-0 bottom-0 w-1.5 bg-${color}-400 group-hover:bg-${color}-600 transition-colors`}></div>
                <div className="flex items-start gap-4 pl-2">
                    <div className={`p-2 bg-slate-50 rounded-lg text-slate-400 group-hover:text-${color}-600 transition-colors`}>
                        <Icon name={item.icon} size={24} />
                    </div>
                    <div>
                        <h4 className="font-bold text-slate-800 text-lg mb-1">{item.title}</h4>
                        <p className="text-slate-500 text-sm leading-relaxed">{item.behavior}</p>
                    </div>
                    <div className="ml-auto self-center opacity-0 group-hover:opacity-100 transition-opacity transform translate-x-2 group-hover:translate-x-0">
                        <Icon name="ChevronRight" className={`text-${color}-500`} />
                    </div>
                </div>
            </div>
        );

        const DetailModal = ({ item, domain, onClose, ui, lang }) => {
            const [activeTab, setActiveTab] = useState('fondamental');

            const handlePrint = () => {
                const element = document.getElementById('printable-area');
                const opt = {
                    margin: 15,
                    filename: `DYS_Expert_${lang}_${item.id}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                window.html2pdf().set(opt).from(element).save();
            };

            const solutions = item.solutions[activeTab] || [];

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm overflow-y-auto">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl animate-fade-in my-8 flex flex-col max-h-[95vh]">
                        
                        {/* Header */}
                        <div className={`bg-gradient-to-r from-${domain.color}-500 to-${domain.color}-600 p-6 rounded-t-2xl text-white flex justify-between items-start shrink-0 shadow-md`}>
                            <div>
                                <div className="flex items-center gap-2 text-white/80 text-xs font-bold uppercase tracking-widest mb-2">
                                    <Icon name={domain.icon} size={14}/> {domain.title}
                                </div>
                                <h2 className="text-2xl md:text-3xl font-black leading-tight flex items-center gap-3">
                                    {item.title}
                                </h2>
                            </div>
                            <button onClick={onClose} className="bg-white/20 hover:bg-white/30 p-2 rounded-full transition-colors text-white">
                                <Icon name="X" size={24} />
                            </button>
                        </div>

                        {/* Controls */}
                        <div className="p-3 bg-slate-50 border-b border-slate-200 flex gap-2 shrink-0 no-print overflow-x-auto">
                            <button 
                                onClick={() => setActiveTab('fondamental')}
                                className={`flex-1 py-3 px-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition-all ${activeTab === 'fondamental' ? `bg-white text-${domain.color}-700 shadow-sm ring-1 ring-${domain.color}-300` : 'text-slate-500 hover:bg-slate-100'}`}
                            >
                                <Icon name="School" size={18} /> {ui.tabPrimary}
                            </button>
                            <button 
                                onClick={() => setActiveTab('secondaire')}
                                className={`flex-1 py-3 px-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition-all ${activeTab === 'secondaire' ? `bg-white text-${domain.color}-700 shadow-sm ring-1 ring-${domain.color}-300` : 'text-slate-500 hover:bg-slate-100'}`}
                            >
                                <Icon name="GraduationCap" size={18} /> {ui.tabSecondary}
                            </button>
                        </div>

                        {/* Content */}
                        <div id="printable-area" className="p-8 overflow-y-auto bg-white flex-grow">
                            {/* Print Header */}
                            <div className="hidden print:block mb-6 border-b pb-4">
                                <h1 className="text-3xl font-bold text-slate-900">{ui.title}</h1>
                                <p className="text-sm text-slate-500">{item.title} | {activeTab === 'fondamental' ? ui.tabPrimary : ui.tabSecondary}</p>
                            </div>

                            {/* Neuro-Logic Box */}
                            <div className={`mb-8 bg-${domain.color}-50 rounded-xl p-6 border-l-4 border-${domain.color}-500 relative print:border-slate-300 print:bg-white`}>
                                <div className="flex items-center gap-2 mb-3">
                                    <div className={`bg-${domain.color}-100 p-1.5 rounded-lg text-${domain.color}-700`}>
                                        <Icon name="BrainCircuit" size={20} />
                                    </div>
                                    <h3 className={`text-${domain.color}-900 font-bold text-lg`}>{ui.neuroLogicTitle}</h3>
                                </div>
                                <p className="text-slate-800 leading-relaxed font-medium">
                                    {item.neuro_logic}
                                </p>
                            </div>

                            {/* Interventionen */}
                            <h3 className="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2 border-b pb-2">
                                <Icon name="Wrench" className={`text-${domain.color}-600`} /> 
                                {ui.interventionsTitle}
                            </h3>

                            <div className="grid gap-6">
                                {solutions.map((sol, idx) => (
                                    <div key={idx} className="flex gap-4 group">
                                        <div className="flex flex-col items-center">
                                            <div className={`w-8 h-8 rounded-full bg-${domain.color}-100 text-${domain.color}-600 flex items-center justify-center font-bold text-sm border-2 border-white shadow-sm shrink-0`}>
                                                {idx + 1}
                                            </div>
                                            {idx !== solutions.length - 1 && <div className="w-0.5 flex-grow bg-slate-100 my-1 group-hover:bg-${domain.color}-100 transition-colors"></div>}
                                        </div>
                                        <div className="pb-2">
                                            <div className="flex items-center gap-2 mb-1 flex-wrap">
                                                <h4 className="font-bold text-slate-900 text-lg">{sol.name}</h4>
                                                <span className="text-[10px] uppercase font-bold px-2 py-0.5 bg-slate-100 text-slate-500 rounded-full border border-slate-200">
                                                    {sol.tag}
                                                </span>
                                            </div>
                                            <p className="text-slate-600 leading-relaxed text-base">
                                                {sol.text}
                                            </p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            
                            <div className="hidden print:block mt-8 pt-4 border-t text-xs text-slate-400">
                                {ui.footer}
                            </div>
                        </div>

                        {/* Footer */}
                        <div className="p-4 border-t bg-slate-50 rounded-b-2xl flex justify-between items-center shrink-0 no-print">
                            <span className="text-xs text-slate-400 font-medium">
                                {ui.sources}
                            </span>
                            <button 
                                onClick={handlePrint}
                                className={`px-6 py-2.5 rounded-lg bg-slate-800 hover:bg-slate-900 text-white font-bold flex items-center gap-2 shadow-lg transition-all`}
                            >
                                <Icon name="Printer" size={18} /> {ui.print}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [view, setView] = useState('home');
            const [lang, setLang] = useState('de'); // 'de' or 'fr'
            const [currentDomainId, setCurrentDomainId] = useState(null);
            const [currentSymptom, setCurrentSymptom] = useState(null);

            const handleDomainSelect = (id) => {
                setCurrentDomainId(id);
                setView('domain');
                window.scrollTo(0,0);
            };

            const handleBack = () => {
                setView('home');
                setCurrentDomainId(null);
            };

            const toggleLang = () => {
                setLang(prev => prev === 'de' ? 'fr' : 'de');
            };

            const currentContent = content[lang];
            const currentData = currentContent.data;
            const currentDomain = currentDomainId ? currentData[currentDomainId] : null;

            return (
                <div className="min-h-screen pb-12 bg-[#ecfeff] pattern-grid">
                    {/* Header */}
                    <nav className="bg-white/90 backdrop-blur-md border-b border-cyan-100 sticky top-0 z-30 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={handleBack}>
                                <div className="bg-gradient-to-r from-cyan-500 to-blue-600 text-white p-2 rounded-lg shadow-md">
                                    <Icon name="Brain" size={20} />
                                </div>
                                <span className="font-black text-slate-900 text-xl tracking-tight hidden md:inline">PsyNavi: <span className="text-cyan-600">{currentContent.ui.uiTitle || "Expert"}</span></span>
                                <span className="font-black text-slate-900 text-xl tracking-tight md:hidden">PsyNavi</span>
                            </div>
                            
                            <div className="flex items-center gap-4">
                                {/* Language Toggle */}
                                <button 
                                    onClick={toggleLang}
                                    className="flex items-center gap-1 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-full font-bold text-sm transition-colors border border-slate-200"
                                >
                                    <span className={lang === 'de' ? "text-slate-900" : "text-slate-400"}>DE</span>
                                    <span className="text-slate-300">|</span>
                                    <span className={lang === 'fr' ? "text-slate-900" : "text-slate-400"}>FR</span>
                                </button>

                                <div className="hidden md:flex gap-3">
                                    <span className="px-3 py-1 bg-cyan-50 text-cyan-700 rounded-full text-xs font-bold border border-cyan-100">{currentContent.ui.edition}</span>
                                    <span className="px-3 py-1 bg-slate-100 text-slate-600 rounded-full text-xs font-bold">{currentContent.ui.levels}</span>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <div className="max-w-7xl mx-auto px-4 pt-10">
                        {/* HOME VIEW */}
                        {view === 'home' && (
                            <div className="animate-fade-in">
                                <header className="text-center mb-16 max-w-3xl mx-auto">
                                    <h1 className="text-4xl md:text-5xl font-black text-slate-900 mb-6 leading-tight">
                                        {currentContent.ui.headerTitle}<span className="text-cyan-500">.</span>
                                    </h1>
                                    <p className="text-lg text-slate-600 leading-relaxed">
                                        {currentContent.ui.headerSubtitle}
                                    </p>
                                </header>

                                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
                                    {Object.entries(currentData).map(([key, data]) => (
                                        <DomainCard key={key} id={key} data={data} onClick={handleDomainSelect} ui={currentContent.ui} />
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* DOMAIN VIEW */}
                        {view === 'domain' && currentDomain && (
                            <div className="animate-fade-in">
                                <button 
                                    onClick={handleBack} 
                                    className="mb-8 flex items-center gap-2 text-slate-500 hover:text-cyan-600 font-bold transition-colors inline-flex px-4 py-2 hover:bg-white rounded-lg"
                                >
                                    <Icon name="ArrowLeft" size={20} /> {currentContent.ui.back}
                                </button>

                                <div className="grid lg:grid-cols-12 gap-8">
                                    {/* Sidebar */}
                                    <div className="lg:col-span-4">
                                        <div className={`bg-gradient-to-br from-${currentDomain.color}-500 to-${currentDomain.color}-600 text-white rounded-3xl p-8 shadow-2xl sticky top-28`}>
                                            <div className="bg-white/20 w-16 h-16 rounded-2xl flex items-center justify-center backdrop-blur-md mb-6 shadow-inner">
                                                <Icon name={currentDomain.icon} size={32} />
                                            </div>
                                            <h2 className="text-3xl font-black mb-2">{currentDomain.title}</h2>
                                            <p className="text-white/80 font-bold uppercase tracking-wider text-sm mb-6">{currentDomain.subtitle}</p>
                                            <p className="text-white/90 leading-relaxed mb-8">{currentDomain.desc}</p>
                                            
                                            <div className="bg-black/10 rounded-xl p-4 border border-white/10">
                                                <div className="flex items-center gap-2 font-bold mb-2 text-sm">
                                                    <Icon name="Info" size={16}/> {currentContent.ui.noteTitle}
                                                </div>
                                                <p className="text-xs text-white/80 leading-relaxed">
                                                    {currentContent.ui.noteText}
                                                </p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Content */}
                                    <div className="lg:col-span-8 space-y-4">
                                        <h3 className="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                                            <span className={`bg-${currentDomain.color}-100 text-${currentDomain.color}-600 p-2 rounded-lg`}>
                                                <Icon name="List" size={20} />
                                            </span>
                                            {currentContent.ui.symptomsTitle}
                                        </h3>
                                        {currentDomain.patterns.map(item => (
                                            <SymptomItem 
                                                key={item.id} 
                                                item={item} 
                                                color={currentDomain.color} 
                                                onClick={() => setCurrentSymptom(item)}
                                            />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* MODAL */}
                    {currentSymptom && currentDomain && (
                        <DetailModal 
                            item={currentSymptom} 
                            domain={currentDomain} 
                            onClose={() => setCurrentSymptom(null)}
                            ui={currentContent.ui}
                            lang={lang}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
