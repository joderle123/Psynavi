            >
                <div className="flex items-start justify-between mb-4">
                    <span className="text-6xl">{activity.emoji}</span>
                    <div className="text-right">
                        <span className={`px-3 py-1 rounded-full text-xs font-bold ${categoryColors[activity.category]}`}>
                            {activity.categoryName}
                        </span>
                    </div>
                </div>
                <h3 className="title-font text-2xl text-white mb-2 drop-shadow-lg">{activity.title}</h3>
                <p className="text-white/90 text-sm mb-4">{activity.description}</p>
                <div className="flex items-center justify-between text-white/80 text-sm">
                    <span className="flex items-center gap-1">
                        <Icon name="Clock" size={16} />
                        {activity.time}
                    </span>
                    <DifficultyStars level={activity.difficulty} />
                </div>
            </div>
        );

        // Detail-Modal Komponente
        const ActivityModal = ({ activity, onClose, onDownload }) => {
            if (!activity) return null;

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto">
                    <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl" id={`activity-detail-${activity.id}`}>
                        {/* Header */}
                        <div className={`bg-gradient-to-br ${activity.theme} p-6 rounded-t-3xl relative`}>
                            <button
                                onClick={onClose}
                                className="absolute top-4 right-4 w-10 h-10 bg-white/20 rounded-full flex items-center justify-center text-white hover:bg-white/40 transition-colors no-print"
                            >
                                <Icon name="X" size={24} />
                            </button>
                            <div className="flex items-center gap-4">
                                <span className="text-7xl">{activity.emoji}</span>
                                <div>
                                    <span className={`px-3 py-1 rounded-full text-xs font-bold ${categoryColors[activity.category]} mb-2 inline-block`}>
                                        {activity.categoryName}
                                    </span>
                                    <h2 className="title-font text-3xl text-white drop-shadow-lg">{activity.title}</h2>
                                    <div className="flex items-center gap-4 text-white/90 mt-2">
                                        <span className="flex items-center gap-1">
                                            <Icon name="Clock" size={16} />
                                            {activity.time}
                                        </span>
                                        <DifficultyStars level={activity.difficulty} />
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Content */}
                        <div className="p-6 space-y-6">
                            {/* Beschreibung */}
                            <p className="text-lg text-gray-700">{activity.description}</p>

                            {/* Materialien */}
                            <div className="bg-gray-50 rounded-2xl p-4">
                                <h3 className="font-bold text-gray-800 mb-3 flex items-center gap-2">
                                    <span className="text-xl">📦</span> Das brauchst du:
                                </h3>
                                <div className="flex flex-wrap gap-2">
                                    {activity.materials.map((material, i) => (
                                        <span key={i} className="px-3 py-1 bg-white rounded-full text-sm shadow-sm">
                                            {material}
                                        </span>
                                    ))}
                                </div>
                            </div>

                            {/* Schritte */}
                            <div>
                                <h3 className="font-bold text-gray-800 mb-3 flex items-center gap-2">
                                    <span className="text-xl">📝</span> So geht's:
                                </h3>
                                <div className="space-y-3">
                                    {activity.steps.map((step, i) => (
                                        <div key={i} className="flex gap-3 items-start">
                                            <div className={`w-8 h-8 rounded-full bg-gradient-to-br ${activity.theme} text-white flex items-center justify-center font-bold flex-shrink-0 shadow-md`}>
                                                {i + 1}
                                            </div>
                                            <p className="text-gray-700 pt-1">{step}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Fun Fact */}
                            <div className="bg-yellow-50 border-2 border-yellow-200 rounded-2xl p-4">
                                <h3 className="font-bold text-yellow-800 mb-2 flex items-center gap-2">
                                    <span className="text-xl">💡</span> Wusstest du?
                                </h3>
                                <p className="text-yellow-900">{activity.funFact}</p>
                            </div>

                            {/* Variationen/Tipps falls vorhanden */}
                            {activity.variations && (
                                <div className="bg-blue-50 border-2 border-blue-200 rounded-2xl p-4">
                                    <h3 className="font-bold text-blue-800 mb-2 flex items-center gap-2">
                                        <span className="text-xl">🎯</span> Variationen:
                                    </h3>
                                    <ul className="list-disc list-inside text-blue-900 space-y-1">
                                        {activity.variations.map((v, i) => <li key={i}>{v}</li>)}
                                    </ul>
                                </div>
                            )}

                            {/* Sicherheitstipp falls vorhanden */}
                            {activity.safetyTip && (
                                <div className="bg-red-50 border-2 border-red-200 rounded-2xl p-4">
                                    <h3 className="font-bold text-red-800 mb-2 flex items-center gap-2">
                                        <span className="text-xl">⚠️</span> Sicherheits-Tipp:
                                    </h3>
                                    <p className="text-red-900">{activity.safetyTip}</p>
                                </div>
                            )}

                            {/* Download Button */}
                            <button
                                onClick={() => onDownload(activity)}
                                className={`w-full py-4 bg-gradient-to-r ${activity.theme} text-white rounded-2xl font-bold text-lg shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2 no-print`}
                            >
                                <Icon name="Download" size={24} />
                                Als PDF herunterladen
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Hauptkomponente
        const App = () => {
            const [selectedActivity, setSelectedActivity] = useState(null);
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [searchTerm, setSearchTerm] = useState('');

            const categories = [
                { id: 'all', name: 'Alle', emoji: '🌈' },
                { id: 'experiment', name: 'Experimente', emoji: '🧪' },
                { id: 'movement', name: 'Bewegung', emoji: '🏃' },
                { id: 'creative', name: 'Kreativ', emoji: '🎨' },
                { id: 'nature', name: 'Natur', emoji: '🌿' },
                { id: 'imagination', name: 'Fantasie', emoji: '✨' },
            ];

            const filteredActivities = activities.filter(act => {
                const matchesCategory = selectedCategory === 'all' || act.category === selectedCategory;
                const matchesSearch = act.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    act.description.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            const downloadPDF = async (activity) => {
                const element = document.getElementById(`activity-detail-${activity.id}`);

                const opt = {
                    margin: 10,
                    filename: `Aktivitaet_${activity.id}_${activity.title.replace(/[^a-zA-Z0-9äöüÄÖÜß]/g, '_')}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                // Hide buttons temporarily
                const buttons = element.querySelectorAll('.no-print');
                buttons.forEach(btn => btn.style.display = 'none');

                await html2pdf().set(opt).from(element).save();

                // Show buttons again
                buttons.forEach(btn => btn.style.display = '');
            };

            const downloadAllPDF = async () => {
                for (const activity of activities) {
                    setSelectedActivity(activity);
                    await new Promise(resolve => setTimeout(resolve, 100));
                    await downloadPDF(activity);
                    await new Promise(resolve => setTimeout(resolve, 300));
                }
                setSelectedActivity(null);
            };

            return (
                <div className="min-h-screen">
                    {/* Header */}
                    <header className="bg-white/80 backdrop-blur-lg shadow-lg sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 py-4">
                            <div className="flex items-center justify-between flex-wrap gap-4">
                                <div className="flex items-center gap-4">
                                    <div className="w-16 h-16 rainbow-border p-1 rounded-2xl">
                                        <div className="w-full h-full bg-white rounded-xl flex items-center justify-center">
                                            <span className="text-3xl bounce-icon">🎉</span>
                                        </div>
                                    </div>
                                    <div>
                                        <h1 className="title-font text-3xl bg-gradient-to-r from-pink-500 via-purple-500 to-blue-500 bg-clip-text text-transparent">
                                            PsyNavi Aktivitäten
                                        </h1>
                                        <p className="text-gray-500">20 Zauberhafte Abenteuer für kleine Entdecker</p>
                                    </div>
                                </div>
                                <button
                                    onClick={downloadAllPDF}
                                    className="flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-pink-500 via-purple-500 to-blue-500 text-white rounded-full shadow-lg hover:shadow-xl transition-all transform hover:scale-105"
                                >
                                    <Icon name="Download" size={20} />
                                    <span className="font-bold">Alle herunterladen</span>
                                </button>
                            </div>

                            {/* Suche & Filter */}
                            <div className="mt-4 flex flex-col md:flex-row gap-4">
                                <div className="relative flex-1">
                                    <Icon name="Search" size={20} className="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400" />
                                    <input
                                        type="text"
                                        placeholder="Aktivität suchen..."
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="w-full pl-12 pr-4 py-3 rounded-full border-2 border-gray-200 focus:border-purple-400 focus:outline-none transition-colors"
                                    />
                                </div>
                                <div className="flex gap-2 overflow-x-auto pb-2">
                                    {categories.map(cat => (
                                        <button
                                            key={cat.id}
                                            onClick={() => setSelectedCategory(cat.id)}
                                            className={`px-4 py-2 rounded-full whitespace-nowrap transition-all ${
                                                selectedCategory === cat.id
                                                    ? 'bg-gradient-to-r from-pink-500 to-purple-500 text-white shadow-lg'
                                                    : 'bg-white text-gray-600 hover:bg-gray-100'
                                            }`}
                                        >
                                            <span className="mr-1">{cat.emoji}</span>
                                            {cat.name}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Info Banner */}
                    <div className="bg-gradient-to-r from-green-200 via-blue-200 to-purple-200 py-4">
                        <div className="max-w-7xl mx-auto px-4">
                            <div className="flex items-center justify-center gap-4 text-gray-700 flex-wrap">
                                <span className="text-2xl bounce-icon">🎈</span>
                                <p className="text-center">
                                    <strong>Für Kinder von 4-6 Jahren</strong> • Spielen, Entdecken, Staunen!
                                </p>
                                <span className="text-2xl bounce-icon" style={{animationDelay: '0.5s'}}>🎈</span>
                            </div>
                        </div>
                    </div>

                    {/* Stats */}
                    <div className="max-w-7xl mx-auto px-4 py-6">
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div className="bg-white rounded-2xl p-4 shadow-md text-center">
                                <span className="text-3xl">🎯</span>
                                <p className="text-2xl font-bold text-purple-600">20</p>
                                <p className="text-gray-500 text-sm">Aktivitäten</p>
                            </div>
                            <div className="bg-white rounded-2xl p-4 shadow-md text-center">
                                <span className="text-3xl">🧪</span>
                                <p className="text-2xl font-bold text-pink-600">5</p>
                                <p className="text-gray-500 text-sm">Experimente</p>
                            </div>
                            <div className="bg-white rounded-2xl p-4 shadow-md text-center">
                                <span className="text-3xl">🏃</span>
                                <p className="text-2xl font-bold text-green-600">3</p>
                                <p className="text-gray-500 text-sm">Bewegungsspiele</p>
                            </div>
                            <div className="bg-white rounded-2xl p-4 shadow-md text-center">
                                <span className="text-3xl">🎨</span>
                                <p className="text-2xl font-bold text-blue-600">100%</p>
                                <p className="text-gray-500 text-sm">Spaßgarantie</p>
                            </div>
                        </div>
                    </div>

                    {/* Aktivitäten Grid */}
                    <main className="max-w-7xl mx-auto px-4 pb-12">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                            {filteredActivities.map(activity => (
                                <ActivityCard
                                    key={activity.id}
                                    activity={activity}
                                    onClick={setSelectedActivity}
                                />
                            ))}
                        </div>

                        {filteredActivities.length === 0 && (
                            <div className="text-center py-12">
                                <span className="text-6xl">🔍</span>
                                <p className="text-gray-500 mt-4">Keine Aktivitäten gefunden</p>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t py-6">
                        <div className="max-w-7xl mx-auto px-4 text-center">
                            <p className="text-gray-500">
                                🎉 PsyNavi Aktivitäten • Erstellt mit Liebe für kleine Abenteurer
                            </p>
                            <p className="text-gray-400 text-sm mt-2">
                                Alle Aktivitäten sind kindersicher und für den Einsatz mit Erwachsenen konzipiert.
                            </p>
                        </div>
                    </footer>

                    {/* Modal */}
                    {selectedActivity && (
                        <ActivityModal
                            activity={selectedActivity}
                            onClose={() => setSelectedActivity(null)}
                            onDownload={downloadPDF}
                        />
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
