                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">{t.duration_label}</label>
                                    <div className="flex gap-3">
                                        <button onClick={() => setSymptomDuration('short')} className={`flex-1 py-3 border rounded-lg text-sm font-bold ${symptomDuration === 'short' ? 'bg-slate-800 text-white' : 'hover:bg-slate-50'}`}>{t.duration_short}</button>
                                        <button onClick={() => setSymptomDuration('long')} className={`flex-1 py-3 border rounded-lg text-sm font-bold ${symptomDuration === 'long' ? 'bg-slate-800 text-white' : 'hover:bg-slate-50'}`}>{t.duration_long}</button>
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">{t.distress_label}</label>
                                    <input type="range" min="0" max="100" value={distressLevel} onChange={(e) => setDistressLevel(e.target.value)} className="w-full accent-teal-600"/>
                                </div>
                                <div className="flex items-center gap-4 p-4 bg-slate-50 rounded-lg">
                                    <Icon name="Eye" size={20} className="text-slate-400" />
                                    <span className="flex-1 font-bold text-sm">{t.organic_check}</span>
                                    <button onClick={() => setOrganicCheck(!organicCheck)} className={`w-10 h-6 rounded-full relative ${organicCheck ? 'bg-teal-600' : 'bg-slate-300'}`}>
                                        <div className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-all ${organicCheck ? 'left-5' : 'left-1'}`}></div>
                                    </button>
                                </div>
                                <div className="pt-4 border-t flex justify-between">
                                    <button onClick={resetApp} className="text-slate-500 font-bold text-sm">{t.back_to_home}</button>
                                    <Button onClick={() => setView('screening')} disabled={studentName.length < 2}>{t.start_screening}</Button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // --- SCREENING ---
            if (view === 'screening') {
                return (
                    <div className="min-h-screen bg-slate-50 pb-24">
                        <header className="bg-white border-b px-6 py-4 sticky top-0 z-10 shadow-sm flex justify-between items-center">
                            <h2 className="font-bold flex items-center gap-2"><Icon name="ClipboardList" size={20} className="text-teal-600"/> {t.screening_phase}</h2>
                            <span className="text-sm font-bold text-slate-400">{studentName}</span>
                        </header>
                        <main className="max-w-3xl mx-auto p-6 space-y-3">
                            <div className="bg-slate-800 text-white p-4 rounded-lg text-sm mb-6 flex gap-3">
                                <Icon name="Info" size={20} className="text-teal-400" />
                                {t.screening_intro}
                            </div>
                            {screeningQuestions.map((q) => (
                                <div key={q.id} className="bg-white p-4 rounded-lg border shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3">
                                    <div className="flex-1">
                                        <div className="font-medium text-sm text-slate-800">{q.text[lang]}</div>
                                        <div className="text-[10px] text-slate-300 font-mono mt-1">{q.id.toUpperCase()}</div>
                                    </div>
                                    <div className="flex gap-1">
                                        {[0, 1, 2, 3].map(val => (
                                            <button key={val} onClick={() => handleScore(q.id, val)} className={`w-9 h-9 rounded text-xs font-bold border ${scores[q.id] === val ? 'bg-teal-700 text-white border-teal-700' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}`}>{val}</button>
                                        ))}
                                        <button onClick={() => handleScore(q.id, -1)} className={`w-9 h-9 rounded text-xs font-bold border ml-1 ${scores[q.id] === -1 ? 'bg-slate-200 text-slate-500' : 'bg-slate-50 text-slate-300 border-slate-100'}`}>NB</button>
                                    </div>
                                </div>
                            ))}
                        </main>
                        <div className="fixed bottom-0 left-0 right-0 p-4 bg-white border-t flex justify-center shadow-lg z-20">
                            <Button onClick={calculateResult} variant="accent" className="w-full max-w-sm">
                                <Icon name="Zap" size={16} /> {t.evaluate}
                            </Button>
                        </div>
                    </div>
                );
            }

            // --- RESULT ---
            if (view === 'result' && resultModule) {
                const mod = resultModule;
                return (
                    <div className="min-h-screen bg-slate-100 p-6">
                        <div className="max-w-2xl mx-auto">
                            <div className="bg-white rounded-2xl shadow-lg overflow-hidden">
                                <div className={`h-2 bg-${mod.colorKey}-500`}></div>
                                <div className="p-8">
                                    <div className="text-center mb-8">
                                        <div className={`w-20 h-20 mx-auto bg-${mod.colorKey}-100 rounded-full flex items-center justify-center mb-4`}>
                                            <Icon name={mod.icon} size={40} className={`text-${mod.colorKey}-600`} />
                                        </div>
                                        <h1 className="text-2xl font-black text-slate-900 mb-2">{t.dossier_title}</h1>
                                        <p className="text-slate-500">{t.confidential}</p>
                                    </div>

                                    <div className={`bg-${mod.colorKey}-50 border-l-4 border-${mod.colorKey}-500 rounded-r-lg p-6 mb-6`}>
                                        <div className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">{t.diagnosis_title}</div>
                                        <h2 className="text-xl font-black text-slate-900">{mod.fullName[lang]}</h2>
                                        <p className="text-sm text-slate-600 font-mono mt-1">{mod.icd}</p>
                                    </div>

                                    <div className="bg-rose-50 border border-rose-200 rounded-lg p-4 mb-6">
                                        <div className="flex gap-3">
                                            <Icon name="AlertTriangle" className="text-rose-600 shrink-0" />
                                            <div className="text-sm text-rose-800">
                                                <strong>{t.disclaimer}</strong><br/>{t.medical_check}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex flex-col gap-3">
                                        <Button onClick={() => goToModule(mod.id)} variant="accent" className="w-full">
                                            <Icon name="ArrowRight" size={16} /> {t.go_to_module}: {mod.name[lang]}
                                        </Button>
                                        <button onClick={resetApp} className="text-slate-500 font-bold text-sm py-2">
                                            {t.back_to_home}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // --- MODULE VIEW ---
            if (view === 'module' && currentModule) {
                const mod = currentModule;
                return (
                    <div className="min-h-screen" style={{backgroundColor: mod.bgColor}}>
                        <nav className="bg-white/90 backdrop-blur-md border-b sticky top-0 z-30">
                            <div className="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
                                <div className="flex items-center gap-3 cursor-pointer" onClick={resetApp}>
                                    <div className={`bg-${mod.colorKey}-500 text-white p-2 rounded-lg`}>
                                        <Icon name={mod.icon} size={20} />
                                    </div>
                                    <span className="font-black text-slate-900">{t.appTitle}: <span className={`text-${mod.colorKey}-600`}>{mod.name[lang]}</span></span>
                                </div>
                                <div className="flex gap-1 bg-slate-100 p-1 rounded">
                                    {['de', 'fr'].map(l => (
                                        <button key={l} onClick={() => setLang(l)} className={`px-2 py-0.5 text-xs font-bold rounded ${lang === l ? 'bg-white shadow' : 'text-slate-500'}`}>{l.toUpperCase()}</button>
                                    ))}
                                </div>
                            </div>
                        </nav>

                        <div className="max-w-5xl mx-auto px-4 pt-8 pb-12">
                            <button onClick={resetApp} className="mb-6 flex items-center gap-2 text-slate-500 hover:text-slate-700 font-bold text-sm">
                                <Icon name="ArrowLeft" size={18} /> {t.back_to_home}
                            </button>

                            <header className="text-center mb-10">
                                <h1 className="text-3xl font-black text-slate-900 mb-2">{mod.fullName[lang]}</h1>
                                <p className="text-slate-500">{mod.description[lang]} | {mod.icd}</p>
                            </header>

                            <div className="grid md:grid-cols-2 gap-4">
                                {Object.entries(mod.domains).map(([key, domain]) => (
                                    <DomainCard key={key} id={key} domain={domain} colorKey={mod.colorKey} onClick={goToDomain} lang={lang} t={t} />
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            // --- DOMAIN VIEW ---
            if (view === 'domain' && currentModule && currentDomainId) {
                const mod = currentModule;
                const domain = mod.domains[currentDomainId];

                return (
                    <div className="min-h-screen" style={{backgroundColor: mod.bgColor}}>
                        <nav className="bg-white/90 backdrop-blur-md border-b sticky top-0 z-30">
                            <div className="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className={`bg-${mod.colorKey}-500 text-white p-2 rounded-lg`}>
                                        <Icon name={mod.icon} size={20} />
                                    </div>
                                    <span className="font-black text-slate-900">{mod.name[lang]}: <span className={`text-${mod.colorKey}-600`}>{domain.title[lang]}</span></span>
                                </div>
                            </div>
                        </nav>

                        <div className="max-w-4xl mx-auto px-4 pt-8 pb-12">
                            <button onClick={() => setView('module')} className="mb-6 flex items-center gap-2 text-slate-500 hover:text-slate-700 font-bold text-sm">
                                <Icon name="ArrowLeft" size={18} /> {t.back_to_overview}
                            </button>

                            <div className="grid lg:grid-cols-3 gap-8">
                                <div className="lg:col-span-1">
                                    <div className={`bg-gradient-to-br from-${mod.colorKey}-500 to-${mod.colorKey}-600 text-white rounded-2xl p-6 sticky top-24`}>
                                        <div className="bg-white/20 w-14 h-14 rounded-xl flex items-center justify-center mb-4">
                                            <Icon name={domain.icon} size={28} />
                                        </div>
                                        <h2 className="text-2xl font-black mb-1">{domain.title[lang]}</h2>
                                        <p className="text-white/80 text-sm font-medium">{domain.subtitle[lang]}</p>
                                    </div>
                                </div>

                                <div className="lg:col-span-2 space-y-4">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                        <Icon name="List" size={18} className={`text-${mod.colorKey}-600`} />
                                        {t.symptomsTitle}
                                    </h3>
                                    {domain.patterns.map(pattern => (
                                        <PatternItem key={pattern.id} pattern={pattern} colorKey={mod.colorKey} onClick={() => setCurrentPattern(pattern)} lang={lang} />
                                    ))}
                                </div>
                            </div>
                        </div>

                        {currentPattern && (
                            <InterventionModal pattern={currentPattern} domain={domain} module={mod} onClose={() => setCurrentPattern(null)} lang={lang} t={t} />
                        )}
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
